name: Skill Publish

on:
  workflow_call:
    inputs:
      skill_path:
        description: Optional path to one skill folder. When set, only this skill is processed.
        required: false
        type: string
        default: ""
      root:
        description: Directory containing skill folders for catalog publishing.
        required: false
        type: string
        default: skills
      dry_run:
        description: Preview only. When true, no publish mutation is performed.
        required: false
        type: boolean
        default: true
      owner:
        description: Optional owner/publisher handle for org publishing.
        required: false
        type: string
        default: ""
      tags:
        description: Optional comma-separated tags override.
        required: false
        type: string
        default: latest
      registry:
        description: ClawHub registry URL.
        required: false
        type: string
        default: https://clawhub.ai
      site:
        description: ClawHub site URL.
        required: false
        type: string
        default: https://clawhub.ai
      ref:
        description: Optional caller repository ref to check out.
        required: false
        type: string
        default: ""
      version:
        description: Optional explicit version to publish. When set, passed to clawhub skill publish --version (leading 'v' is stripped).
        required: false
        type: string
        default: ""
      clawhub_source_repo:
        description: Repository containing the ClawHub CLI source.
        required: false
        type: string
        default: "openclaw/clawhub"
      clawhub_source_ref:
        description: Ref of the ClawHub CLI source repository to check out.
        required: false
        type: string
        default: "main"
      pending_poll_seconds:
        description: Seconds to wait between polls when the publish status is pending-publication.
        required: false
        type: number
        default: 5
      pending_poll_retries:
        description: Maximum number of extra polls when the publish status is pending-publication.
        required: false
        type: number
        default: 3
    secrets:
      clawhub_token:
        required: false
    outputs:
      publish_json:
        description: Structured JSON output from skill publishing.
        value: ${{ jobs.publish.outputs.publish_json }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish_json: ${{ steps.capture.outputs.publish_json }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Checkout ClawHub CLI source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.clawhub_source_repo }}
          ref: ${{ inputs.clawhub_source_ref }}
          path: clawhub-source

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Validate publish mode inputs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CLAWHUB_TOKEN: ${{ secrets.clawhub_token }}
        run: |
          if [[ "$DRY_RUN" == "true" || -n "$CLAWHUB_TOKEN" ]]; then
            exit 0
          fi
          echo "::error::Real skill publishes need secrets.clawhub_token. GitHub OIDC trusted publishing for skills is not supported yet."
          exit 1

      - name: Write ClawHub config
        env:
          CLAWHUB_TOKEN: ${{ secrets.clawhub_token }}
          CLAWHUB_REGISTRY: ${{ inputs.registry }}
        run: |
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "No ClawHub token provided, skipping config file creation."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(
              json.dumps({"registry": os.environ["CLAWHUB_REGISTRY"], "token": os.environ["CLAWHUB_TOKEN"]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(path)
          PY
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Run skill publishes
        env:
          INPUT_SKILL_PATH: ${{ inputs.skill_path }}
          INPUT_ROOT: ${{ inputs.root }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_SITE: ${{ inputs.site }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          PENDING_POLL_SECONDS: ${{ inputs.pending_poll_seconds }}
          PENDING_POLL_RETRIES: ${{ inputs.pending_poll_retries }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          cli_entry = workspace / "clawhub-source" / "packages" / "clawhub" / "src" / "cli.ts"
          if not cli_entry.is_file():
              raise SystemExit(f"Missing ClawHub CLI entrypoint at {cli_entry}")

          def resolve_inside_workspace(raw_path):
              path = (workspace / raw_path).resolve()
              try:
                  path.relative_to(workspace)
              except ValueError as exc:
                  raise SystemExit(f"Publish path must be inside the caller repository: {raw_path}") from exc
              return path

          def is_skill_folder(path):
              return path.is_dir() and any((path / name).is_file() for name in ("SKILL.md", "skill.md"))

          skill_path = os.environ["INPUT_SKILL_PATH"].strip()
          root_input = os.environ["INPUT_ROOT"].strip() or "skills"
          if skill_path:
              targets = [resolve_inside_workspace(skill_path)]
              if not is_skill_folder(targets[0]):
                  raise SystemExit(f"skill_path is not a skill folder: {skill_path}")
          else:
              root = resolve_inside_workspace(root_input)
              if is_skill_folder(root):
                  targets = [root]
              elif root.is_dir():
                  discovered = []
                  for child in root.iterdir():
                      resolved_child = resolve_inside_workspace(child)
                      if is_skill_folder(resolved_child):
                          discovered.append(resolved_child)
                  targets = sorted(discovered, key=lambda child: child.name.lower())
              else:
                  targets = []
              if not targets:
                  raise SystemExit(f"No skill folders found under: {root_input}")

          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=workspace, text=True
          ).strip()
          source_ref = os.environ["INPUT_REF"].strip() or os.environ["SOURCE_REF"].strip()
          dry_run = os.environ["INPUT_DRY_RUN"] == "true"
          owner = os.environ["INPUT_OWNER"].strip()
          tags = os.environ["INPUT_TAGS"].strip()
          version_input = os.environ["INPUT_VERSION"].strip()
          version = version_input[1:] if version_input.startswith("v") else version_input

          pending_poll_seconds = max(0, int(os.environ.get("PENDING_POLL_SECONDS", "5")))
          pending_poll_retries = max(0, int(os.environ.get("PENDING_POLL_RETRIES", "3")))

          results = {"wouldPublish": [], "published": [], "alreadySynced": [], "skipped": [], "pendingPublication": [], "failed": []}
          status_keys = {
              "would-publish": "wouldPublish",
              "published": "published",
              "unchanged": "alreadySynced",
              "pending-publication": "pendingPublication",
          }

          def read_skill_version(skill_dir):
              for name in ("SKILL.md", "skill.md"):
                  path = skill_dir / name
                  if not path.is_file():
                      continue
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if line.startswith("version:"):
                          return line.split(":", 1)[1].strip()
              return None

          def publish_with_poll(command, slug, folder, max_retries, poll_seconds, poll_pending=True):
              for attempt in range(max_retries + 1):
                  completed = subprocess.run(command, cwd=workspace, capture_output=True, text=True)
                  if completed.returncode != 0:
                      message = completed.stderr.strip() or completed.stdout.strip() or f"exit {completed.returncode}"
                      return {"ok": False, "slug": slug, "folder": folder, "message": message}

                  try:
                      result = json.loads(completed.stdout)
                      status = result["status"]
                  except (KeyError, ValueError, json.JSONDecodeError) as exc:
                      return {"ok": False, "slug": slug, "folder": folder, "message": f"Invalid publish output: {exc}"}

                  if status != "pending-publication" or attempt == max_retries or (not poll_pending and status == "pending-publication"):
                      result["_pollAttempts"] = attempt
                      return {"ok": True, "status": status, "result": result}

                  print(f"Status for {slug} is pending-publication, waiting {poll_seconds}s before retry {attempt + 1}/{max_retries}...")
                  time.sleep(poll_seconds)

          for target in targets:
              relative_path = target.relative_to(workspace).as_posix()
              command = [
                  "bun", str(cli_entry),
                  "--workdir", str(workspace),
                  "--site", os.environ["INPUT_SITE"],
                  "--registry", os.environ["INPUT_REGISTRY"],
                  "skill", "publish", relative_path,
                  "--json",
                  "--source-repo", os.environ["SOURCE_REPOSITORY"],
                  "--source-commit", source_commit,
                  "--source-path", relative_path,
              ]
              if dry_run:
                  command.append("--dry-run")
              if owner:
                  command += ["--owner", owner]
              if tags:
                  command += ["--tags", tags]
              if source_ref:
                  command += ["--source-ref", source_ref]
              if version:
                  command += ["--version", version]

              outcome = publish_with_poll(command, target.name, relative_path, pending_poll_retries, pending_poll_seconds)
              if not outcome["ok"]:
                  message = outcome["message"]
                  if version and "already exists" in message.lower():
                      print(f"Version {version} already exists on ClawHub; treating as unchanged.")
                      results["alreadySynced"].append({"slug": outcome["slug"], "folder": outcome["folder"], "_version": version, "_alreadyExistsMessage": message})
                  else:
                      results["failed"].append({"slug": outcome["slug"], "folder": outcome["folder"], "message": message})
                  continue

              status = outcome["status"]
              result = outcome["result"]
              if status == "unchanged":
                  local_version = read_skill_version(target)
                  remote_version = result.get("latestVersion")
                  if local_version and remote_version and local_version != remote_version:
                      print(f"SKILL.md version ({remote_version} -> {local_version}) differs from ClawHub but fingerprint unchanged; forcing publish with explicit --version...")
                      forced_command = command + ["--version", local_version]
                      outcome = publish_with_poll(forced_command, target.name, relative_path, pending_poll_retries, pending_poll_seconds, poll_pending=False)
                      if not outcome["ok"]:
                          message = outcome["message"]
                          if "already exists" in message.lower():
                              print(f"Version {local_version} already exists on ClawHub; treating as unchanged.")
                              result["_versionAlreadyExists"] = True
                              result["_alreadyExistsMessage"] = message
                              results["alreadySynced"].append(result)
                          else:
                              results["failed"].append({"slug": outcome["slug"], "folder": outcome["folder"], "message": message})
                          continue
                      status = outcome["status"]
                      result = outcome["result"]
                      result["_forcedVersionPublish"] = True
                      if status == "pending-publication":
                          print(f"Version {local_version} submitted and is pending review on ClawHub.")
                          result["_pendingReview"] = True

              results[status_keys[status]].append(result)

          output = {
              "ok": not results["failed"],
              "dryRun": dry_run,
              "registry": os.environ["INPUT_REGISTRY"],
              "roots": [skill_path or root_input],
              **({"owner": owner.lstrip("@") } if owner else {}),
              "summary": {key: len(value) for key, value in results.items()},
              **results,
          }
          output_path = Path(os.environ["RUNNER_TEMP"]) / "skill-publish.json"
          output_path.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(output, indent=2))
          if results["failed"]:
              sys.exit(1)
          PY

      - name: Capture workflow outputs
        id: capture
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path(os.environ["RUNNER_TEMP"]) / "skill-publish.json"
          if not output_path.is_file():
              print(f"Publish output not found at {output_path}; skipping capture.")
              raise SystemExit(0)
          parsed = json.loads(output_path.read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write("publish_json<<__CLAWHUB_JSON__\n")
              fh.write(json.dumps(parsed, indent=2))
              fh.write("\n__CLAWHUB_JSON__\n")
          PY

      - name: Upload publish JSON artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: clawhub-skill-publish-json
          path: ${{ runner.temp }}/skill-publish.json
          if-no-files-found: ignore
